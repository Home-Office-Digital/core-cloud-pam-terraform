name: SAST Scans

on:
  workflow_call:
    secrets:
      sonar_token:
        required: true
      sonar_host_url:
        required: true
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  actions: read
  security-events: write

jobs:
  checkov-scan:
    name: Run Checkov Scan
    uses: Home-Office-Digital/core-cloud-workflow-checkov-sast-scan/.github/workflows/checkov-scan-tfplan.yaml@1.17.5
    with:
      path: '.'
      # 1.17.5 defaults org to UKHomeOffice, which is the stale mirror. Set it
      # explicitly so the central Checkov policies come from the same org as the
      # workflow itself.
      org: 'Home-Office-Digital'
  sonarqube-scan:
    name: Run SonarQube Scan
    uses: Home-Office-Digital/core-cloud-workflow-sonarqube-scan/.github/workflows/sonarqube-scan.yaml@1.3.0
    secrets:
      sonar_token: ${{ secrets.sonar_token }}
      sonar_host_url: ${{ secrets.sonar_host_url }}
